<!doctype html>
<html lang="en" class="light" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover exposes the safe-area insets the shell pads against -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Same policy as the desktop shell, and for the same reason: this page
         renders LLM output and other people's transcripts, and the Capacitor
         layer beneath it can open folder pickers and upload files.

         The hash covers the boot-paint probe further down — the only inline
         script in the app. Vite copies it through verbatim, so the source and
         the built file hash alike. If you edit that script you must recompute
         this, and the failure is quiet but harmless: the script is blocked,
         __prismBootPaintedAt stays 0, and 0 already means "do not hold".
         Recompute with `tools/csp-hash.mjs` after any edit to it. (The command
         is in that file rather than written out here on purpose: spelling the
         tag out in this comment puts a literal script open-tag in the markup,
         which anything scanning this file then matches by mistake.) -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'none';
      script-src 'self' 'sha256-SAynYTjUUxpJDEtn1ImGH+6fiWI6xWlP4w0xDNt0CZA=';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: blob:;
      font-src 'self' data:;
      media-src 'self' blob:;
      connect-src 'self' https://xpfkhiycdlvwgpbghxak.supabase.co;
      base-uri 'none';
      form-action 'none';
      object-src 'none';
    " />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="no-referrer" />
    <title>Prism</title>
    <meta name="description" content="Prism — your calls, written up. Notes, action items and tasks on your phone." />

    <!-- installable web app / iOS home-screen app -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#F4F4F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Prism" />
    <link rel="icon" href="prism-icon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- Boot splash — a pixel match for the native launch screen.
         iOS dismisses LaunchScreen.storyboard as soon as the web view exists,
         which is well before React has mounted, so without this there is a
         visible gap: white launch screen, then an empty grey web view, then the
         app. This paints the same mark and wordmark in the same places, so the
         handoff from native to web is invisible and the only thing that changes
         on screen is the app arriving.

         Inline rather than in a stylesheet on purpose: an external file is one
         more round trip before the first paint, which is the exact gap this
         exists to cover. Values are hard-coded to match the storyboard — a
         launch screen cannot read the token layer, so neither should this. -->
    <style>
      #boot {
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; align-items: center; justify-content: center;
      }
      /* The white ground is its OWN layer rather than #boot's background, so the
         mark can trail it by a hair on the way out. See below. */
      #boot .boot-bg {
        position: absolute; inset: 0; background: #FFFFFF;
        transition: opacity .3s ease-out;
      }

      /* THE EXIT. Re-measured off a frame-by-frame sample of Instagram's, because
         the previous numbers here were read wrong and the mistake was visible.

         What the recording actually shows: the logo and the app cross-dissolve.
         Sampling the logo's alpha (its saturation over white IS its alpha) against
         the app's, frame by frame, the two are mirror images over one shared ~300ms
         window — they sum to a little over 1 the whole way through, peaking at 1.13:

             logo  1.00  0.63  0.30  0.11  0.02
             app   0.00  0.50  0.80  0.94  1.00
             sum   1.00  1.13  1.10  1.05  1.02

         The old comment claimed the ground clears first and the logo hangs over the
         revealed app for ~90ms. It does not — that sum would spike to ~1.6, and it
         did here: at 160ms the ground was gone and the mark was still at full black
         over a completely finished screen for another ~130ms. That was the sticker-
         on-the-app look.

         Ground and mark both 300ms ease-out, mark +25ms. The lag is deliberate but
         tiny — Instagram's sum peaks a little over 1, so the logo does trail the
         ground, but by well under one frame. 25ms reproduces that peak; 40ms
         overshot it by holding the mark at a flat 1.0 for two frames after the app
         had already started arriving. Do not grow it: everything that was wrong
         with the old version was this number being too big.

         The one thing the old note had right: the logo does NOT scale on exit. */
      #boot[data-exit] { pointer-events: none; }
      #boot[data-exit] .boot-bg { opacity: 0; }
      #boot .boot-mark, #boot b {
        transition: opacity .3s ease-out .025s;
      }
      #boot[data-exit] .boot-mark, #boot[data-exit] b { opacity: 0; }
      #boot .boot-mark { display: flex; }

      /* Both fading layers get their own compositor layer.
         This transition happens at the single busiest moment in the app's life —
         React has just committed, the store is hydrating, the first network calls
         are going out — and an opacity fade left on the main thread drops frames
         exactly when they are most visible. Promoted, the fade is composited and
         cannot be stuttered by any of that. */
      #boot .boot-bg, #boot .boot-mark, #boot b { will-change: opacity; }

      /* 74 x 74 — the chevron-asterisk mark is square (1000 x 1000), unlike the
         old six-point asterisk this replaced (74 x 70). Must stay equal to the
         storyboard's LaunchMark constraints or the native-to-web handoff jumps.

         flex:none is load-bearing. An <svg> with no width/height ATTRIBUTES has
         no intrinsic width, so as a flex item with the default flex-shrink:1 it
         collapses to 0px wide — the CSS width is simply overridden — and the
         splash renders the wordmark with no mark above it. The attributes on the
         element are the second belt: this has to survive. */
      #boot svg { width: 74px; height: 74px; flex: none; fill: #181819; }
      #boot b {
        position: absolute; left: 0; right: 0; bottom: 64px;
        text-align: center;
        font: 700 19px -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        letter-spacing: -0.022em; color: #181819;
      }
      /* NO PULSE. The design's Prism Loading.html breathes the mark — scale
         1 -> 1.055, opacity 1 -> .92, 2.4s looping — and that used to run here.
         Instagram's does not move at all: sampled every frame of the hold, its
         logo's alpha is a flat 1.000 and its size never changes. A pulse also
         makes the handover from the storyboard visible, because the native half
         cannot animate and so sits perfectly still right up until the web half
         takes over and starts twitching.

         To put it back: re-add `animation: breathe 2.4s ease-in-out infinite` to
         `#boot svg` with the keyframes, plus `#boot[data-exit] svg {
         animation-play-state: paused }` so it does not wobble on the way out, and
         a prefers-reduced-motion rule to switch it off. */
    </style>
    <script type="module" crossorigin src="./assets/mobile-BhZS7I-m.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/mobile-0_oNt70Z.css">
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <i class="boot-bg"></i>
      <span class="boot-mark"><svg width="74" height="74" viewBox="0 0 1000 1000" role="img" aria-label="Prism">
        <path d="M194.176 98.717L98.717 194.176L337.041 432.5L0 432.5L0 567.5L337.041 567.5L98.717 805.824L194.176 901.283L565.195 530.264A42.8 42.8 0 0 0 565.195 469.736Z"/>
        <path d="M583.014 321.526L648.21 386.721A160.2 160.2 0 0 1 674.356 421.103L901.283 194.176L805.824 98.7169Z"/><path d="M583.014 678.474L805.824 901.283L901.283 805.824L674.356 578.897A160.2 160.2 0 0 1 648.21 613.279Z"/><path d="M1000 567.5L1000 432.5L680.216 432.5A160.2 160.2 0 0 1 680.216 567.5Z"/><path d="M432.5 0L432.5 171.012L567.5 306.012L567.5 0Z"/><path d="M567.5 693.988L432.5 828.988L432.5 1000L567.5 1000Z"/>
      </svg></span>
      <b>Prism</b>
    </div>
    <!-- Tell the native shell this is on screen, and when.
         Inline and immediately after #boot so it runs the moment the splash is
         parsed, ahead of the module below. TWO frames, for the same reason
         dropBoot uses two: one rAF can still land before the paint it was
         scheduled by. AppDelegate polls for this and pulls its own cover the
         instant it turns up — see "The launch handoff" there.

         Also the clock the minimum hold is measured from. Left at 0 if rAF never
         runs (a page that launched straight into the background never paints, and
         rAF does not fire while hidden) — and 0 is read as "do not hold", which
         is the right way for this to fail. -->
    <script>
      window.__prismBootPaintedAt = 0
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { window.__prismBootPaintedAt = performance.now() })
      })
    </script>
    <div id="root"></div>
  </body>
</html>
